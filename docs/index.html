<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Markdown Viewer</title>
  <!-- Load Marked library to parse Markdown into HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    #content {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Container where the parsed markdown will appear -->
  <div id="content">Loading content...</div>

  <script>
    // 1. URL pointing to the raw Markdown file
    const markdownUrl = 'https://raw.githubusercontent.com/sandwich-makes-code/WoL/README.md';

    // 2. Fetch the Markdown file content
    fetch(markdownUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error('Failed to load markdown file');
        }
        return response.text();
      })
      .then(markdownText => {
        // 3. Convert Markdown to HTML and insert it into the page
        document.getElementById('content').innerHTML = marked.parse(markdownText);
      })
      .catch(error => {
        document.getElementById('content').innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
      });
  </script>

</body>
</html>
