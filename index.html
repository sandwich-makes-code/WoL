<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Webpage</title>
  
  <style>
    /* ==========================================
       1. THEME VARIABLES
       ========================================== */
    :root {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
      --toggle-bg: #f0f0f0;
      --toggle-hover: #e0e0e0;
    }

    /* Target the body element when .dark-mode class is present */
    body.dark-mode {
      --bg-color: #121212;
      --text-color: #f5f5f5;
      --toggle-bg: #2a2a2a;
      --toggle-hover: #3a3a3a;
    }

    /* ==========================================
       2. PAGE LAYOUT
       ========================================== */
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 40px; 
      transition: background-color 0.2s ease, color 0.2s ease; 
    }

    /* ==========================================
       3. TOP-RIGHT ICON TOGGLE BUTTON
       ========================================== */
    #theme-toggle {
      position: fixed; 
      top: 20px;
      right: 20px;
      background-color: var(--toggle-bg);
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      transition: background-color 0.2s ease, transform 0.1s ease;
      z-index: 1000; 
    }

    #theme-toggle:hover {
      background-color: var(--toggle-hover);
    }

    #theme-toggle:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Fixed Top-Right Icon Button -->
  <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>

  <!-- YOUR CONTENT GOES HERE -->
  <h1>My Document Title</h1>
  <p>Start writing your text here. Click the icon in the top right to switch themes.</p>

  <!-- ==========================================
       4. JAVASCRIPT FUNCTIONALITY
       ========================================== */
  <script>
    const toggleBtn = document.getElementById('theme-toggle');

    // 1. Core function to set the theme explicitly
    function setTheme(theme) {
      if (theme === 'dark') {
        document.body.classList.add('dark-mode');
        toggleBtn.textContent = '☀️';
        try { localStorage.setItem('theme', 'dark'); } catch(e) {}
      } else {
        document.body.classList.remove('dark-mode');
        toggleBtn.textContent = '🌙';
        try { localStorage.setItem('theme', 'light'); } catch(e) {}
      }
    }

    // 2. Load the saved preference safely
    let savedTheme = 'light';
    try {
      savedTheme = localStorage.getItem('theme');
    } catch (e) {
      // Local storage might be blocked in some local file environments
      console.log("Local storage is restricted."); 
    }

    // Initialize page with the correct theme
    setTheme(savedTheme);

    // 3. Toggle theme cleanly on button click
    toggleBtn.addEventListener('click', () => {
      const isDarkNow = document.body.classList.contains('dark-mode');
      // If it is dark now, switch it to light. Otherwise, switch to dark.
      setTheme(isDarkNow ? 'light' : 'dark');
    });
  </script>

</body>
</html>
