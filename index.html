<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Webpage</title>
  
  <style>
    /* ==========================================
       1. VARIABLES (Light Theme Default)
       ========================================== */
    :root {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
      --toggle-bg: #f0f0f0;
    }

    /* 2. Overrides when body has the .dark-mode class */
    body.dark-mode {
      --bg-color: #121212;
      --text-color: #f5f5f5;
      --toggle-bg: #2a2a2a;
    }

    /* ==========================================
       3. PAGE LAYOUT
       ========================================== */
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 40px; 
      transition: background-color 0.2s ease, color 0.2s ease; 
    }

    /* ==========================================
       4. TOP-RIGHT ICON TOGGLE BUTTON
       ========================================== */
    #theme-toggle {
      position: fixed; 
      top: 20px;
      right: 20px;
      background-color: var(--toggle-bg);
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      z-index: 1000; 
    }
  </style>
</head>
<body>

  <!-- Fixed Top-Right Icon Button -->
  <button id="theme-toggle">🌙</button>

  <!-- YOUR CONTENT GOES HERE -->
  <h1>My Document Title</h1>
  <p>Start writing your text directly here...</p>

  <!-- ==========================================
       5. WORKING JAVASCRIPT
       ========================================== */
  <script>
    const toggleBtn = document.getElementById('theme-toggle');

    toggleBtn.addEventListener('click', () => {
      // Toggle the class on the body tag
      document.body.classList.toggle('dark-mode');
      
      // Check if it's currently dark to swap the emoji icon
      if (document.body.classList.contains('dark-mode')) {
        toggleBtn.textContent = '☀️';
      } else {
        toggleBtn.textContent = '🌙';
      }
    });
  </script>

</body>
</html>
