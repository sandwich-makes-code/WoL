<!DOCTYPE html>
<link href="https://googleapis.com" rel="stylesheet">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Webpage</title>
  
  <style>
    /* ==========================================
       1. THEME VARIABLES
       ========================================== */
    :root {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
      --toggle-bg: #f0f0f0;
      --toggle-hover: #e0e0e0;
    }

    .dark-mode {
      --bg-color: #121212;
      --text-color: #f5f5f5;
      --toggle-bg: #2a2a2a;
      --toggle-hover: #3a3a3a;
    }

    /* ==========================================
       2. PAGE LAYOUT (Write your text here)
       ========================================== */
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 40px; /* Gives your text breathing room from edges */
      transition: background-color 0.3s ease, color 0.3s ease; 
    }

    /* ==========================================
       3. TOP-RIGHT ICON TOGGLE BUTTON
       ========================================== */
    #theme-toggle {
      position: fixed; /* Keeps button in place even if you scroll down */
      top: 20px;
      right: 20px;
      background-color: var(--toggle-bg);
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      transition: background-color 0.3s ease, transform 0.1s ease;
      z-index: 1000; /* Ensures it sits on top of your text */
    }

    #theme-toggle:hover {
      background-color: var(--toggle-hover);
    }

    #theme-toggle:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Fixed Top-Right Icon Button -->
  <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>

  <!-- YOUR CONTENT GOES HERE -->
  <h1>My Document Title</h1>
  <p>Start writing your text or adding your elements here. The text will automatically switch between dark and light colors when you tap the icon in the top-right corner.</p>

  <!-- ==========================================
       4. JAVASCRIPT FUNCTIONALITY
       ========================================== */
  <script>
    const toggleBtn = document.getElementById('theme-toggle');
    const savedTheme = localStorage.getItem('theme');

    // Apply saved theme preference right away
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-mode');
      toggleBtn.textContent = '☀️';
    } else {
      document.body.classList.add('light-mode');
      toggleBtn.textContent = '🌙';
    }

    // Handle clicks
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      
      const isDarkMode = document.body.classList.contains('dark-mode');
      
      if (isDarkMode) {
        toggleBtn.textContent = '☀️';
        localStorage.setItem('theme', 'dark');
      } else {
        toggleBtn.textContent = '🌙';
        localStorage.setItem('theme', 'light');
      }
    });
  </script>

</body>
</html>
