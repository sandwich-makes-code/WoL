<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Webpage</title>
  
  <style>
    /* ==========================================
       1. GLOBAL THEME DEFINITION
       ========================================== */
    :root {
      /* This tells the browser the page supports both modes */
      color-scheme: light dark; 
      
      /* light-dark(LIGHT_COLOR, DARK_COLOR) */
      --bg-color: light-dark(#ffffff, #121212);
      --text-color: light-dark(#1a1a1a, #f5f5f5);
      --toggle-bg: light-dark(#f0f0f0, #2a2a2a);
      --toggle-hover: light-dark(#e0e0e0, #3a3a3a);
    }

    /* ==========================================
       2. PAGE LAYOUT
       ========================================== */
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 40px; 
      transition: background-color 0.2s ease, color 0.2s ease; 
    }

    /* ==========================================
       3. TOP-RIGHT ICON TOGGLE BUTTON
       ========================================== */
    #theme-toggle {
      position: fixed; 
      top: 20px;
      right: 20px;
      background-color: var(--toggle-bg);
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      transition: background-color 0.2s ease, transform 0.1s ease;
      z-index: 1000; 
    }

    #theme-toggle:hover {
      background-color: var(--toggle-hover);
    }

    #theme-toggle:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Fixed Top-Right Icon Button -->
  <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>

  <!-- YOUR CONTENT GOES HERE -->
  <h1>My Document Title</h1>
  <p>Start writing your text here. Click the icon in the top right to switch themes.</p>

  <!-- ==========================================
       4. ONE-LINE JAVASCRIPT FUNCTIONALITY
       ========================================== */
  <script>
    const toggleBtn = document.getElementById('theme-toggle');

    toggleBtn.addEventListener('click', () => {
      // Toggle the browser color-scheme between light and dark
      const isDark = document.documentElement.style.colorScheme === 'dark';
      document.documentElement.style.colorScheme = isDark ? 'light' : 'dark';
      
      // Toggle the icon emoji instantly
      toggleBtn.textContent = isDark ? '🌙' : '☀️';
    });
  </script>

</body>
</html>
